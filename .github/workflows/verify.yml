name: Verify (build + tests)

# Единый workflow полной проверки: компиляция всего solution на Windows-раннере
# (с -warnaserror) + прогон unit/integration-тестов. Нужен, чтобы поймать ошибки по
# всем коммитам без локальной Windows-машины. Запуск — вручную (workflow_dispatch)
# и на push в рабочие ветки / PR.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  cross-platform:
    name: Build & unit-test (Linux, cross-platform layer)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # net10.0 slice only (no WPF/native): the fast feedback loop for Domain, Application,
      # Infrastructure, ViewModels, Engines and the DjVu plugin. WPF + native smoke run on Windows below.
      # -maxcpucount:1: passing -f to a *solution* build sets TargetFramework globally, which
      # breaks project-reference dedup and races on shared outputs (Domain.deps.json). Serialize.
      # CS0535 gate (§1 «дрейф интерфейс/имплементация» в docs/DEV_RETROSPECTIVE.md): этот build
      # обязан красно падать, если в кросс-платформенных impl не реализован новый член интерфейса.
      # CS0535 — error по C#-спеке, плюс -warnaserror подтягивает любые сопутствующие warning'и.
      - name: Build (warnings as errors)
        run: dotnet build Foliant.CrossPlatform.slnf -c Release -f net10.0 -warnaserror -maxcpucount:1

      - name: Test (unit only)
        run: >-
          dotnet test Foliant.CrossPlatform.slnf
          -c Release
          -f net10.0
          --no-build
          --filter "Category!=Slow&Category!=Integration&Category!=E2E"
          --settings tests/coverage.runsettings
          --results-directory ./coverage

      # Покрытие объединяется построчно по basename (coverlet пишет один исходник под разными
      # путями в разных тест-проектах). Все 4 слоя §6.2 блокирующие: Domain 100 %
      # (declaration-only интерфейсы/enum'ы исключены через tests/coverage.runsettings — без
      # исполняемого IL), Application/Infrastructure/ViewModels — выше своих порогов.
      - name: Coverage gate (§6.2)
        run: >-
          dotnet run --project tools/check-coverage -c Release -f net10.0 --no-build
          -- --report ./coverage
          --enforce Foliant.Domain,Foliant.Application,Foliant.Infrastructure,Foliant.ViewModels

      # Real-SQLite persistence tests (disk cache + FTS index) — cross-platform, run on Linux.
      - name: Integration (real SQLite)
        run: >-
          dotnet test tests/Foliant.Infrastructure.Tests/Foliant.Infrastructure.Tests.csproj
          -c Release
          -f net10.0
          --no-build
          --filter "Category=Integration"

      # DjVu engine runs out-of-process via DjVuLibre — install it and exercise the real
      # ddjvu/djvused round-trip (render + page size) against a tiny bundled sample.
      - name: Install DjVuLibre
        run: sudo apt-get update && sudo apt-get install -y djvulibre-bin

      - name: DjVu engine integration (real ddjvu)
        run: >-
          dotnet test tests/Foliant.Plugin.DjVu.Tests/Foliant.Plugin.DjVu.Tests.csproj
          -c Release
          -f net10.0
          --no-build
          --filter "Category=Slow"

  verify:
    name: Build & test (Windows)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Fetch native dependencies (no-op until checksums.json exists)
        shell: pwsh
        run: ./tools/fetch-natives.ps1 -Quiet

      - name: Restore
        run: dotnet restore Foliant.sln

      # CS0535 gate, Windows-side (§1 «дрейф интерфейс/имплементация» в docs/DEV_RETROSPECTIVE.md):
      # Windows-only impls (Foliant.App, Foliant.UI, net10.0-windows TFM в Infrastructure/DjVu) НЕ
      # покрываются Linux-джобом выше — interface drift в них всплывает ТОЛЬКО здесь. CS0535 — error
      # по C#-спеке; -warnaserror добавляет страховку от косвенных warning'ов. Лог пишем в файл,
      # чтобы следующий шаг мог явно проверить отсутствие CS0535 как safety-net.
      - name: Build (warnings as errors)
        shell: pwsh
        run: |
          dotnet build Foliant.sln -c Release --no-restore -warnaserror 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      # Safety-net на случай, если кто-то в будущем ослабит -warnaserror или подавит CS0535
      # через .editorconfig/SuppressMessage: явный grep по build-логу. CS0535 здесь — всегда красный.
      - name: Assert no CS0535 (interface drift safety-net)
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) {
            Write-Host "build.log not found (build step failed before producing output); nothing to scan."
            exit 0
          }
          $hits = Select-String -Path build.log -Pattern 'CS0535' -SimpleMatch
          if ($hits) {
            Write-Host "::error::CS0535 detected — interface implementation drift. See docs/DEV_RETROSPECTIVE.md §1."
            $hits | ForEach-Object { Write-Host $_.Line }
            exit 1
          }
          Write-Host "No CS0535 in build output."

      # Slow = тесты, требующие нативных движков/моделей (PaddleOCR, DjVu, PDF-mutation
      # roundtrip) — на чистом раннере их моделей нет; E2E — отдельный UI-прогон.
      - name: Test (unit + integration)
        run: >-
          dotnet test Foliant.sln
          -c Release
          --no-build
          --filter "Category!=Slow&Category!=E2E"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7
