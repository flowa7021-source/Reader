name: Verify (build + tests)

# Единый workflow полной проверки: компиляция всего solution на Windows-раннере
# (с -warnaserror) + прогон unit/integration-тестов. Нужен, чтобы поймать ошибки по
# всем коммитам без локальной Windows-машины. Запуск — вручную (workflow_dispatch)
# и на push в рабочие ветки / PR.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  cross-platform:
    name: Build & unit-test (Linux, cross-platform layer)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # net10.0 slice only (no WPF/native): the fast feedback loop for Domain, Application,
      # Infrastructure, ViewModels, Engines and the DjVu plugin. WPF + native smoke run on Windows below.
      - name: Build (warnings as errors)
        run: dotnet build Foliant.CrossPlatform.slnf -c Release -f net10.0 -warnaserror

      - name: Test (unit only)
        run: >-
          dotnet test Foliant.CrossPlatform.slnf
          -c Release
          -f net10.0
          --no-build
          --filter "Category!=Slow&Category!=Integration&Category!=E2E"

  verify:
    name: Build & test (Windows)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Fetch native dependencies (no-op until checksums.json exists)
        shell: pwsh
        run: ./tools/fetch-natives.ps1 -Quiet

      - name: Restore
        run: dotnet restore Foliant.sln

      - name: Build (warnings as errors)
        run: dotnet build Foliant.sln -c Release --no-restore -warnaserror

      # Slow = тесты, требующие нативных движков/моделей (PaddleOCR, DjVu, PDF-mutation
      # roundtrip) — на чистом раннере их моделей нет; E2E — отдельный UI-прогон.
      - name: Test (unit + integration)
        run: >-
          dotnet test Foliant.sln
          -c Release
          --no-build
          --filter "Category!=Slow&Category!=E2E"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7
