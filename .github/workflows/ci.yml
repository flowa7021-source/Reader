name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  HUSKY: 0  # Husky.Net auto-install (Directory.Build.targets) — no value in CI; CI has its own gates.

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Fetch native dependencies
        shell: pwsh
        run: ./tools/fetch-natives.ps1 -Quiet

      - name: Restore
        # --locked-mode добавим после генерации lock-файлов (Phase 1 / S1).
        run: dotnet restore Foliant.sln

      - name: Verify formatting
        run: dotnet format Foliant.sln --verify-no-changes --no-restore

      # CS0535 gate (§1 «дрейф интерфейс/имплементация» в docs/DEV_RETROSPECTIVE.md): полный
      # Foliant.sln на Windows-раннере — единственная точка, где компилируются Windows-only impls
      # (Foliant.App, Foliant.UI), поэтому interface drift в них падает именно тут. CS0535 —
      # error по C#-спеке; -warnaserror добавляет страховку от сопутствующих warning'ов.
      - name: Build
        run: dotnet build Foliant.sln -c Release --no-restore -warnaserror

      # CI намеренно build-only: тесты и бенчмарки гоняются локально при готовности альфы,
      # не в автоматическом CI. См. план / решение по тестированию.
